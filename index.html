<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera VentaniYA - Estante Aviso</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-white: #ffffff;
            --neon-pink: #ff007f;
            --bg-dark: #050814;
            --panel-bg: #0b1120;
            --border-glow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-white);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #0a1128 0%, #050814 100%);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            letter-spacing: 2px;
        }

        .brand p { font-size: 0.85rem; color: #8ab4f8; letter-spacing: 1px; }

        .casio-clock-container {
            background: #000;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3) inset, 0 0 10px var(--neon-blue);
            padding: 8px 16px;
            border-radius: 4px;
            text-align: right;
        }

        .time-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--neon-white);
            text-shadow: 0 0 8px var(--neon-white);
            letter-spacing: 1px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .display-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-blue);
            border-left: 4px solid var(--neon-blue);
            padding-left: 10px;
            text-shadow: 0 0 5px var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cartelera-multigrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            background: #000;
            border: 2px solid var(--neon-blue);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            max-height: 75vh;
            overflow-y: auto;
        }

        .cartelera-multigrid::-webkit-scrollbar { width: 8px; }
        .cartelera-multigrid::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }

        /* Estructura dividida: Imagen + Panel Lateral Fijo con Datos y Logo */
        .cartel-cell {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            position: relative;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        .cartel-cell.selected-print {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px var(--neon-pink);
        }

        .cartel-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
            min-height: 180px;
        }

        .cartel-img-container {
            width: 100%;
            height: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cartel-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Checkbox flotante para impresión selectiva */
        .print-checkbox-container {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--neon-blue);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
            cursor: pointer;
        }

        .print-checkbox-container input {
            cursor: pointer;
            accent-color: var(--neon-pink);
        }

        /* Panel lateral fijo dentro de cada tarjeta con datos y logo */
        .cartel-right-fixed {
            width: 130px;
            background: rgba(5, 8, 20, 0.98);
            border-left: 1px solid var(--neon-blue);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }

        .sponsor-brand-box {
            text-align: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }

        .sponsor-logo-mini {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: var(--neon-pink);
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-pink);
        }

        .c-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-blue);
            text-shadow: 0 0 3px var(--neon-blue);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .c-detail { font-size: 0.65rem; color: var(--neon-white); word-break: break-all; }
        .c-msg {
            font-size: 0.65rem;
            color: var(--neon-pink);
            text-shadow: 0 0 3px var(--neon-pink);
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .grid-estampas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            max-height: 25vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-estampas::-webkit-scrollbar { width: 6px; }
        .grid-estampas::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }

        .estampa-card {
            background: var(--panel-bg);
            border: 1px solid #1e293b;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .estampa-card:hover { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .estampa-card.selected { border-color: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }

        .estampa-thumb { width: 100%; height: 80px; object-fit: contain; background: #000; display: block; }
        .estampa-info { padding: 4px; font-size: 0.6rem; text-align: center; }
        .estampa-name { color: var(--neon-blue); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-delete-img {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255,0,127,0.8);
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            padding: 1px 4px;
            cursor: pointer;
        }

        .editor-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: fit-content;
        }

        .editor-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .form-group { display: flex; flex-direction: column; gap: 3px; }
        .form-group label { font-size: 0.75rem; color: var(--neon-blue); letter-spacing: 1px; font-weight: bold; }
        
        .form-group input {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-white);
            padding: 6px 8px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
        }

        .upload-box {
            border: 2px dashed var(--neon-blue);
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(0,243,255,0.05);
            font-size: 0.75rem;
            color: var(--neon-blue);
        }
        .upload-box:hover { background: rgba(0,243,255,0.15); }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 5px;
        }

        .btn-action {
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            padding: 10px 4px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            transition: all 0.2s;
            text-align: center;
            font-size: 0.7rem;
        }

        .btn-action:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
        .btn-secondary { background: linear-gradient(90deg, #ff007f, #aa0055); color: #fff; box-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
        .btn-secondary:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        .status-msg { font-size: 0.75rem; color: #00f3ff; text-align: center; min-height: 1rem; font-weight: bold; }

        /* Estilos específicos para impresión (Imprime solo lo seleccionado) */
        @media print {
            body { background: #fff; color: #000; }
            header, .editor-panel, .print-checkbox-container, .btn-delete-img, .section-title button { display: none !important; }
            .main-layout { display: block; padding: 0; }
            .cartelera-multigrid {
                border: none;
                box-shadow: none;
                background: #fff;
                display: block;
                max-height: none;
                overflow: visible;
            }
            .cartel-cell {
                page-break-inside: avoid;
                margin-bottom: 20px;
                border: 2px solid #000 !important;
                background: #fff !important;
                display: flex !important;
            }
            .cartel-right-fixed {
                background: #f1f5f9 !important;
                border-left: 2px solid #000 !important;
                color: #000 !important;
            }
            .c-name, .sponsor-logo-mini { color: #000 !important; text-shadow: none !important; }
            .c-msg { color: #d90429 !important; text-shadow: none !important; }
            .cartel-cell:not(.print-selected-cell) { display: none !important; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <h1>VENTANIYA</h1>
        <p>ESTANTE AVISO - DINÁMICO REAL</p>
    </div>
    <div class="casio-clock-container">
        <div id="live-time" class="time-display">00:00:00.000</div>
        <div id="live-date" class="date-display">00.XXX.0000</div>
    </div>
</header>

<div class="main-layout">
    <div class="display-section">
        <div class="section-title">
            Cartelera en Vivo (Tus Avisos)
            <button class="btn-action" style="padding: 4px 10px; font-size: 0.65rem;" onclick="imprimirSeleccionados()">🖨️ Imprimir Seleccionados</button>
        </div>
        <div class="cartelera-multigrid" id="multigridContainer"></div>
    </div>

    <div class="editor-panel">
        <div class="editor-title">Panel de Control & Auspicio</div>
        
        <div class="form-group">
            <label>Nombre del Comercio / Logo Texto:</label>
            <input type="text" id="sponsorName" value="VENTANIYA AVISOS">
        </div>

        <div class="form-group">
            <label>Teléfono:</label>
            <input type="text" id="sponsorPhone" value="+54 9 11 0000-0000">
        </div>

        <div class="form-group">
            <label>Dirección:</label>
            <input type="text" id="sponsorAddress" value="Av. Principal 123">
        </div>

        <div class="form-group">
            <label>Instagram / Mensaje:</label>
            <input type="text" id="sponsorMsg" value="@ventaniya">
        </div>

        <div class="form-group">
            <label>Cargar Archivos al Sistema:</label>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">+ Subir Imágenes desde tu PC</div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
        </div>

        <div class="section-title" style="font-size: 0.85rem; border-left-color: var(--neon-pink);">Administrar Repositorio:</div>
        <div class="grid-estampas" id="gridEstampas"></div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="btn-container">
            <button class="btn-action" id="btnSetFixed">1. Actualizar Datos</button>
            <button class="btn-action btn-secondary" id="btnResetDefault">2. Reset Guía</button>
        </div>
    </div>
</div>

<script>
    const mesesShort = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SET", "OCT", "NOV", "DIC"];

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const ms = String(now.getMilliseconds()).padStart(3, '0');
        document.getElementById('live-time').textContent = `${h}:${m}:${s}.${ms}`;

        const day = String(now.getDate()).padStart(2, '0');
        const month = mesesShort[now.getMonth()];
        const year = now.getFullYear();
        document.getElementById('live-date').textContent = `${day}.${month}.${year}`;
    }
    setInterval(updateClock, 30);

    let defaultImages = [
        { 
            name: "guia_inicial.svg", 
            data: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect width='100%' height='100% ' fill='%23050814'/><rect x='20' y='20' width='360' height='360' fill='none' stroke='%2300f3ff' stroke-width='3'/><text x='50%' y='45%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='20' fill='%2300f3ff' font-weight='bold'>SUBE TUS FOTOS</text><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='12' fill='%23ff007f'>AQUÍ ABAJO</text></svg>" 
        }
    ];

    let storedImages = JSON.parse(localStorage.getItem('ventaniya_imagenes_db'));
    let listaImagenes = (storedImages && storedImages.length > 0) ? storedImages : defaultImages;
    let selectedIndex = parseInt(localStorage.getItem('ventaniya_img_index')) || 0;
    if (selectedIndex >= listaImagenes.length) selectedIndex = 0;

    const gridSelector = document.getElementById('gridEstampas');
    const multigridContainer = document.getElementById('multigridContainer');

    if(localStorage.getItem('ventaniya_name')) document.getElementById('sponsorName').value = localStorage.getItem('ventaniya_name');
    if(localStorage.getItem('ventaniya_phone')) document.getElementById('sponsorPhone').value = localStorage.getItem('ventaniya_phone');
    if(localStorage.getItem('ventaniya_address')) document.getElementById('sponsorAddress').value = localStorage.getItem('ventaniya_address');
    if(localStorage.getItem('ventaniya_msg')) document.getElementById('sponsorMsg').value = localStorage.getItem('ventaniya_msg');

    function inicializarSistema() {
        gridSelector.innerHTML = '';
        
        listaImagenes.forEach((imgObj, idx) => {
            const card = document.createElement('div');
            card.className = `estampa-card ${idx === selectedIndex ? 'selected' : ''}`;
            card.innerHTML = `
                <button class="btn-delete-img" title="Eliminar imagen" onclick="event.stopPropagation(); eliminarImagen(${idx});">X</button>
                <img class="estampa-thumb" src="${imgObj.data}" alt="${imgObj.name}">
                <div class="estampa-info"><div class="estampa-name">${imgObj.name}</div></div>
            `;

            card.addEventListener('click', () => {
                document.querySelectorAll('.estampa-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedIndex = idx;
            });

            gridSelector.appendChild(card);
        });

        renderMultigrid();
    }

    function renderMultigrid() {
        multigridContainer.innerHTML = '';

        const sName = (localStorage.getItem('ventaniya_name') || "VENTANIYA AVISOS").toUpperCase();
        const sPhone = localStorage.getItem('ventaniya_phone') || "+54 9 11 0000-0000";
        const sAddress = localStorage.getItem('ventaniya_address') || "Av. Principal 123";
        const sMsg = localStorage.getItem('ventaniya_msg') || "@ventaniya";

        listaImagenes.forEach((imgObj, i) => {
            const cell = document.createElement('div');
            cell.className = 'cartel-cell';
            cell.id = `cartel-cell-${i}`;

            cell.innerHTML = `
                <div class="cartel-left">
                    <label class="print-checkbox-container" title="Marcar para imprimir">
                        <input type="checkbox" class="print-select-chk" data-index="${i}" onchange="togglePrintCell(${i})"> Imprimir
                    </label>
                    <div class="cartel-img-container">
                        <img src="${imgObj.data}" alt="${imgObj.name}">
                    </div>
                </div>
                <div class="cartel-right-fixed">
                    <div class="sponsor-brand-box">
                        <div class="sponsor-logo-mini">VTN AVISO</div>
                    </div>
                    <div>
                        <div class="c-name" title="${sName}">${sName}</div>
                        <div class="c-detail">${sPhone}</div>
                        <div class="c-detail">${sAddress}</div>
                    </div>
                    <div class="c-msg" title="${sMsg}">${sMsg}</div>
                </div>
            `;
            multigridContainer.appendChild(cell);
        });
    }

    function togglePrintCell(idx) {
        const cell = document.getElementById(`cartel-cell-${idx}`);
        const chk = cell.querySelector('.print-select-chk');
        if (chk.checked) {
            cell.classList.add('selected-print', 'print-selected-cell');
        } else {
            cell.classList.remove('selected-print', 'print-selected-cell');
        }
    }

    function eliminarImagen(idx) {
        if(listaImagenes.length <= 1) {
            alert("Debe quedar al menos una imagen en el sistema.");
            return;
        }
        listaImagenes.splice(idx, 1);
        localStorage.setItem('ventaniya_imagenes_db', JSON.stringify(listaImagenes));
        if(selectedIndex >= listaImagenes.length) selectedIndex = 0;
        inicializarSistema();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files.length) return;

        let cargados = 0;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(event) {
                if(listaImagenes.length === 1 && listaImagenes[0].name === "guia_inicial.svg") {
                    listaImagenes = [];
                }

                listaImagenes.push({
                    name: file.name,
                    data: event.target.result
                });
                cargados++;

                if(cargados === files.length) {
                    localStorage.setItem('ventaniya_imagenes_db', JSON.stringify(listaImagenes));
                    inicializarSistema();
                    const msg = document.getElementById('statusMsg');
                    msg.textContent = "¡Imágenes agregadas correctamente!";
                    setTimeout(() => { msg.textContent = ""; }, 2500);
                }
            };
            reader.readAsDataURL(file);
        });
    });

    document.getElementById('btnSetFixed').onclick = () => {
        localStorage.setItem('ventaniya_name', document.getElementById('sponsorName').value);
        localStorage.setItem('ventaniya_phone', document.getElementById('sponsorPhone').value);
        localStorage.setItem('ventaniya_address', document.getElementById('sponsorAddress').value);
        localStorage.setItem('ventaniya_msg', document.getElementById('sponsorMsg').value);
        localStorage.setItem('ventaniya_img_index', selectedIndex);

        renderMultigrid();
        const msg = document.getElementById('statusMsg');
        msg.textContent = "¡Datos actualizados con éxito!";
        setTimeout(() => { msg.textContent = ""; }, 2500);
    };

    document.getElementById('btnResetDefault').onclick = () => {
        if(confirm("¿Restaurar imagen guía inicial?")) {
            listaImagenes = defaultImages;
            localStorage.setItem('ventaniya_imagenes_db', JSON.stringify(listaImagenes));
            selectedIndex = 0;
            inicializarSistema();
        }
    };

    function imprimirSeleccionados() {
        const seleccionadas = document.querySelectorAll('.print-selected-cell');
        if(seleccionadas.length === 0) {
            alert("Por favor, marca al menos una casilla 'Imprimir' en los avisos que deseas mandar a la impresora.");
            return;
        }
        window.print();
    }

    inicializarSistema();
</script>

</body>
</html>
