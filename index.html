<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050814;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #0b1120;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .img-container {
            width: 100%;
            height: 250px;
            background: #000;
            border: 1px dashed #1e293b;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .error-msg {
            color: #ff007f;
            font-size: 0.75rem;
            padding: 10px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA - ESTANTE DE AVISOS</h1>
        <p>Estampiyas y carteles para redes sociales</p>
    </header>

    <div class="grid" id="estanteGrid"></div>

    <script>
        // =========================================================================
        // ESCRIBÍ ACÁ EXACTAMENTE CÓMO SE LLAMAN TUS ARCHIVOS
        // (Respetando mayúsculas y minúsculas tal cual los subiste a GitHub)
        // =========================================================================
        const listaEstampiyas = [
            "estampiya1.jpg",
            "estampiya2.jpg",
            "aviso1.png"
        ];

        const grid = document.getElementById('estanteGrid');

        listaEstampiyas.forEach(nombreArchivo => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="img-container">
                    <img src="${nombreArchivo}" alt="${nombreArchivo}" onerror="this.parentElement.innerHTML='<div class=\'error-msg\'>No se encuentra el archivo:<br><b>${nombreArchivo}</b><br><small>Revisá mayúsculas y formato en GitHub</small></div>'">
                </div>
                <div>
                    <a href="${nombreArchivo}" download="${nombreArchivo}" class="btn" target="_blank">📥 Descargar</a>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>

</body>
</html>
