<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #131c31;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background: #00ffcc;
            color: #0b0f19;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA - ESTANTE DE AVISOS</h1>
        <p>Estampiyas y carteles disponibles para descarga</p>
    </header>

    <div class="grid" id="estanteGrid">
        <!-- Las imágenes se cargan dinámicamente o se listan aquí -->
    </div>

    <script>
        // Lista automática de respaldo o nombres comunes que sueles usar.
        // Agregá o quitá nombres acá según lo que subas a tu repositorio.
        const archivos = [
            "estampiya1.jpg",
            "estampiya2.jpg",
            "estampiya3.jpg",
            "aviso1.jpg",
            "aviso2.jpg",
            "imagen1.png",
            "imagen2.png"
        ];

        const grid = document.getElementById('estanteGrid');

        archivos.forEach(nombre => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${nombre}" alt="${nombre}" onerror="this.closest('.card').style.display='none';">
                <br>
                <a href="${nombre}" download="${nombre}" class="btn" target="_blank">📥 Descargar</a>
            `;
            // Solo muestra la tarjeta si la imagen realmente existe en el repositorio (el onerror oculta las que no existan)
            grid.appendChild(card);
        });
    </script>

</body>
</html>
