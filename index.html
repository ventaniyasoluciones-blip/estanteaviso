<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050814;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #0b1120;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .img-container {
            width: 100%;
            height: 250px;
            background: #000;
            border: 1px dashed #1e293b;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .error-msg {
            color: #ff007f;
            font-size: 0.75rem;
            padding: 10px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            margin-top: 5px;
            width: 100%;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .btn-borrar {
            background: linear-gradient(90deg, #ff007f, #99004c);
            color: #fff;
            margin-top: 5px;
        }
        .editor-section, .fijados-section {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            border-top: 2px dashed #00f3ff;
            padding-top: 20px;
        }
        .form-group {
            margin-bottom: 10px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: #050814;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA - ESTANTE DE AVISOS</h1>
        <p>Estampiyas y carteles para comercios (Modo Local Seguro)</p>
    </header>

    <!-- PANEL DE CREACIÓN DE AVISOS -->
    <div class="editor-section">
        <h2>🛠️ Subir Imagen Limpia y Estampar Aviso</h2>
        <div style="background: #0b1120; border: 2px solid #0077ff; border-radius: 8px; padding: 20px; max-width: 600px; margin: 0 auto;">
            <div class="form-group">
                <label for="imagenLimpia">1. Seleccioná tu imagen limpia desde tu dispositivo:</label>
                <input type="file" id="imagenLimpia" accept="image/*">
            </div>
            <div class="form-group">
                <label for="textoAviso">2. Escribí el texto del aviso:</label>
                <textarea id="textoAviso" rows="3" placeholder="Ej: ¡Gran liquidación este fin de semana!"></textarea>
            </div>
            <div class="form-group">
                <label for="logoAvisador">3. Subir logo del avisador (opcional):</label>
                <input type="file" id="logoAvisador" accept="image/*">
            </div>
            <button class="btn" id="btnProcesarYGuardar">✨ Estampar y Guardar en el Estante</button>
        </div>
    </div>

    <!-- SECCIÓN DE AVISOS GUARDADOS EN EL ESTANTE LOCAL -->
    <div class="fijados-section">
        <h2>📌 Estante de Avisos Listos</h2>
        <div class="grid" id="estanteGrid">
            <!-- Aquí aparecerán tus avisos guardados -->
        </div>
    </div>

    <canvas id="canvasProcesamiento"></canvas>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarAvisosLocales();
        });

        document.getElementById('btnProcesarYGuardar').addEventListener('click', () => {
            const inputImagenLimpia = document.getElementById('imagenLimpia');
            const textoAviso = document.getElementById('textoAviso').value;
            const inputLogo = document.getElementById('logoAvisador');

            if (!inputImagenLimpia.files || !inputImagenLimpia.files[0]) {
                alert("Por favor seleccioná una imagen limpia para estampar.");
                return;
            }

            const readerLimpia = new FileReader();
            readerLimpia.onload = function(e) {
                const imgBase = new Image();
                imgBase.src = e.target.result;

                imgBase.onload = () => {
                    const canvas = document.getElementById('canvasProcesamiento');
                    const ctx = canvas.getContext('2d');

                    canvas.width = 1080;
                    canvas.height = 1080;
                    ctx.drawImage(imgBase, 0, 0, canvas.width, canvas.height);

                    const fechaActual = new Date().toLocaleString();
                    const hashAleatorio = "HASH-" + Math.random().toString(36).substring(2, 10).toUpperCase();

                    // Franja inferior técnica
                    ctx.fillStyle = "rgba(5, 8, 20, 0.85)";
                    ctx.fillRect(0, canvas.height - 180, canvas.width, 180);

                    ctx.strokeStyle = "#00f3ff";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height - 180);
                    ctx.lineTo(canvas.width, canvas.height - 180);
                    ctx.stroke();

                    // Texto superior personalizado
                    if (textoAviso.trim() !== "") {
                        ctx.fillStyle = "rgba(0, 243, 255, 0.15)";
                        ctx.fillRect(0, 40, canvas.width, 120);
                        ctx.strokeStyle = "#00f3ff";
                        ctx.strokeRect(0, 40, canvas.width, 120);

                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 32px 'Share Tech Mono', monospace";
                        ctx.textAlign = "center";
                        ctx.fillText(textoAviso, canvas.width / 2, 115);
                    }

                    // Línea de tiempo y Hash
                    ctx.fillStyle = "#00f3ff";
                    ctx.font = "20px 'Share Tech Mono', monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(`📅 TIME: ${fechaActual}`, 30, canvas.height - 120);
                    ctx.fillText(`🔒 HASH: ${hashAleatorio}`, 30, canvas.height - 80);
                    ctx.fillText(`⚡ VENTANIYA - ESTANTE DE AVISOS`, 30, canvas.height - 40);

                    const guardarResultado = (dataUrlFinal) => {
                        const nuevoAviso = {
                            id: Date.now(),
                            imagen: dataUrlFinal,
                            descripcion: textoAviso.trim() !== "" ? textoAviso : "Aviso comercial"
                        };

                        let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_estante_seguro')) || [];
                        avisosGuardados.unshift(nuevoAviso);
                        localStorage.setItem('ventaniya_estante_seguro', JSON.stringify(avisosGuardados));

                        document.getElementById('imagenLimpia').value = '';
                        document.getElementById('textoAviso').value = '';
                        document.getElementById('logoAvisador').value = '';

                        cargarAvisosLocales();
                        alert("¡Aviso estampado con éxito! Ya lo podés descargar para entregar o publicar.");
                    };

                    if (inputLogo.files && inputLogo.files[0]) {
                        const readerLogo = new FileReader();
                        readerLogo.onload = function(eLogo) {
                            const imgLogo = new Image();
                            imgLogo.src = eLogo.target.result;
                            imgLogo.onload = function() {
                                const logoSize = 120;
                                ctx.drawImage(imgLogo, canvas.width - logoSize - 30, canvas.height - logoSize - 30, logoSize, logoSize);
                                guardarResultado(canvas.toDataURL("image/png"));
                            }
                        }
                        readerLogo.readAsDataURL(inputLogo.files[0]);
                    } else {
                        guardarResultado(canvas.toDataURL("image/png"));
                    }
                };
            };
            readerLimpia.readAsDataURL(inputImagenLimpia.files[0]);
        });

        function cargarAvisosLocales() {
            const grid = document.getElementById('estanteGrid');
            grid.innerHTML = '';

            let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_estante_seguro')) || [];

            if (avisosGuardados.length === 0) {
                grid.innerHTML = '<div class="card"><div class="error-msg">El estante está vacío. Subí tu primer aviso arriba.</div></div>';
                return;
            }

            avisosGuardados.forEach(aviso => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${aviso.imagen}" alt="Aviso Estampado">
                    </div>
                    <div style="font-size: 0.8rem; margin-bottom: 10px; color: #fff; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        💬 ${aviso.descripcion}
                    </div>
                    <div>
                        <a href="${aviso.imagen}" download="aviso-ventaniya-${aviso.id}.png" class="btn">📥 Descargar Estampado</a>
                        <button class="btn btn-borrar" onclick="borrarAviso(${aviso.id})">🗑️ Eliminar</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function borrarAviso(id) {
            if (confirm("¿Estás seguro de eliminar este aviso del estante?")) {
                let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_estante_seguro')) || [];
                avisosGuardados = avisosGuardados.filter(aviso => aviso.id !== id);
                localStorage.setItem('ventaniya_estante_seguro', JSON.stringify(avisosGuardados));
                cargarAvisosLocales();
            }
        }
    </script>
</body>
</html>
